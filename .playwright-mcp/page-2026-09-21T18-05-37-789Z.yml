                          - paragraph [ref=f21e275]: "feat(ux): mejoras IALab — UX audit fases 1-3 + encabezado - DailyPlan: contador de pasos, etiquetas de urgencia, XP bug fix (xpReward??xp), barra de progreso del curso, animación escalonada - ValerioFloatingButton: burbuja visible móvil, mensaje contextual primer-visita vs retorno - SidebarCollapsed: etiqueta \"Avance\" bajo ícono de progreso; tooltip del círculo muestra siguiente acción (completar contenido / examen / módulo aprobado) - Celebración #7: confetti pequeño + toast al completar todos los recursos del módulo - Encabezado: ícono fa-flask-vial → fa-brain (comunicación de IA más clara) - Módulos data: M1 fa-terminal→fa-wand-magic-sparkles, M4 fa-microphone→fa-flask, M5 fa-trophy→fa-shield-halved - NotificationContext: pruneLocalNotifications (limpia locales leídas >30 días), cap 30 items - i18n es/en/pt: claves daily_plan, urgency, sidebar_progress_short, content_completed_toast, next_step_* - IALab breadcrumb: título de lección solo en tabs específicas, no en vista Todo - Quiz data: refactor preguntas módulos 1-5 (es/en/pt) - Backend: telemetría, rutas auth, admin"
