                        - term [ref=f21e204]: Deploy
                        - definition [ref=f21e205]:
                          - paragraph [ref=f21e206]: "fix(auth): registrar en el curso de forma transaccional y devolver sesion Dos fallos reales del registro (POST /api/auth/signup), reproducidos contra produccion: - Si el INSERT del perfil en public.users falla (p. ej. RLS porque el cliente desplegado no usa service_role), el auth user quedaba huerfano: ese correo ya no se podia registrar ('ya esta registrado') y el estudiante veia un error generico. Ahora se revierte (deleteUser) y se propaga el error para poder reintentar limpio. - Si el perfil ya existia (duplicado), la respuesta se devolvia SIN token, asi que tras registrarse el estudiante quedaba deslogueado. Ahora se inicia sesion igualmente y se devuelve token + refreshToken. Ademas el username de respuesta ya no depende de profileData (null en el caso duplicado). Verificado E2E con backend local: 201 + token, fila guardada en Supabase y login/course OK."
