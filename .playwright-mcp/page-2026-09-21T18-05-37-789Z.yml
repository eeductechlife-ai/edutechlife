                        - definition [ref=f21e297]:
                          - paragraph [ref=f21e298]: "feat(analytics): Fase 4.3 Valeria Analytics — SmartBoard real data Backend: - GET /api/admin/analytics/smartboard (new endpoint) - Aggregates sessions + academic_context + crisis_alerts + learning_streaks + student_achievements - Returns: overview KPIs, subjectPerformance, dailySessions, streakDistribution, achievementRate - Configurable rolling window via ?days=N (7–90, default 30) - Parallel Promise.all() queries for performance Frontend: - useAdminAnalytics hook — React Query, 5min stale, 2 retries - SmartBoardMetrics rewritten to use real Fase 3 data (replaces PostHog/demo-only) - 4 overview KPIs: totalSessions, activeLast7Days, avgSessionMinutes, atRiskCount - Subject performance cards with progress bars (colored by score: green/yellow/red) - Daily sessions bar chart (last 30 days) - Streak distribution (noStreak/short/medium/long) - Achievement rate panel (total, unique students, avg per active) - AdminHeader: added SmartBoard tab (3rd tab) - AdminDashboard: renders SmartBoardMetrics on smartboard tab Data flows from Fase 3 tables: - sessions → totalSessions, dailySessions, activeLast7Days, avgSessionMinutes - academic_context → subjectPerformance (avgScore + performanceLevels) - crisis_alerts (unresolved) → atRiskCount - learning_streaks → streakDistribution - student_achievements → achievementRate Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
