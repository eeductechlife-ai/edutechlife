# Dependabot: las actualizaciones menores y de parche de cada carpeta llegan en
# UN solo PR por semana; las mayores siguen separadas porque pueden romper algo
# y cada una merece su propia revisión. Antes había un PR por paquete y se
# acumularon unos 20 sin atender.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/edutechlife-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      backend-menores-y-parches:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "npm"
    directory: "/edutechlife-frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      frontend-menores-y-parches:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
