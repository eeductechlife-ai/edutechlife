name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edutechlife-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:smoke
      - run: npm run build

  backend:
    name: Backend (syntax, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edutechlife-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-backend/package-lock.json

      - run: npm ci
      - run: node -c src/index.js
      - run: node -c src/app.js
      - name: Validate backend structure
        run: |
          node -e "
            const fs = require('fs');
            const routesDir = './src/routes';
            if (fs.existsSync(routesDir)) {
              const files = fs.readdirSync(routesDir).filter(f => f.endsWith('.js'));
              console.log('Routes found:', files.join(', '));
            }
          "
