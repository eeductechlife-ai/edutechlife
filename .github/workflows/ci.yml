name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Permitir ejecución manual desde cualquier rama (p. ej. migrations-check).
  workflow_dispatch:
    inputs:
      target:
        description: 'Job a ejecutar (default: todo)'
        required: false
        default: all
        type: choice
        options: [all, migrations-check, staging-setup, staging-journey, lockfile-regenerate]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  smoke:
    name: Smoke Test (fast gate)
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: edutechlife-frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('edutechlife-frontend/package-lock.json') }}

      - name: Cache Vite deps
        uses: actions/cache@v4
        with:
          path: edutechlife-frontend/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('edutechlife-frontend/package-lock.json') }}

      - if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Smoke tests (por directorio — aísla crashes de worker)
        run: |
          set +e
          FAILED=""
          for dir in \
            src/store/__tests__ \
            src/components/DiagnosticoVAK/__tests__ \
            src/components/Nico/__tests__ \
            src/components/kids-dashboard/dani/__tests__ \
            src/components/__tests__ \
            src/services/__tests__ \
            src/utils/__tests__ \
            src/tests/a11y \
            src/tests/integration
          do
            echo "=== DIR $dir ==="
            if ! npx vitest run "$dir" --no-file-parallelism --reporter=dot --bail=3; then
              echo "FAIL_DIR $dir"
              FAILED="$FAILED $dir"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "RESULT=FAILED:$FAILED"
            exit 1
          fi
          echo "RESULT=ALL_PASS"
      - run: npm run build -- --logLevel error
        timeout-minutes: 8

  lint:
    name: Lint + Typecheck
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: edutechlife-frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('edutechlife-frontend/package-lock.json') }}

      - if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: edutechlife-frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('edutechlife-frontend/package-lock.json') }}

      - if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run npm test (shard 1/4)
        run: npx vitest run --pool=forks --no-file-parallelism --reporter=dot --shard=1/4
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      - name: Run npm test (shard 2/4)
        run: npx vitest run --pool=forks --no-file-parallelism --reporter=dot --shard=2/4
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      - name: Run npm test (shard 3/4)
        run: npx vitest run --pool=forks --no-file-parallelism --reporter=dot --shard=3/4
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

      - name: Run npm test (shard 4/4)
        run: npx vitest run --pool=forks --no-file-parallelism --reporter=dot --shard=4/4
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"

  security:
    name: Security Audit
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: edutechlife-frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('edutechlife-frontend/package-lock.json') }}

      - if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=critical || echo "::warning::Critical vulnerabilities found"

  e2e:
    name: E2E (Chromium)
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    needs: smoke
    # E2E authenticated tests require Clerk env vars not set in CI — non-blocking.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: edutechlife-frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('edutechlife-frontend/package-lock.json') }}

      - if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start Vite dev server
        run: npx vite --port 5174 &
        timeout-minutes: 1

      - name: Wait for dev server
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:5174 && break
            sleep 2
          done

      - name: Run E2E tests
        run: npx playwright test --project=chromium

  coverage:
    name: Coverage Report
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    needs: [backend, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend deps
        run: cd edutechlife-backend && npm ci

      - name: Install frontend deps
        run: cd edutechlife-frontend && npm ci

      - name: Backend coverage
        run: cd edutechlife-backend && npm run test:coverage

      - name: Frontend coverage
        run: cd edutechlife-frontend && npx vitest run --coverage --reporter=verbose 2>&1 | tail -20

  lighthouse:
    name: Lighthouse CI
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: edutechlife-frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('edutechlife-frontend/package-lock.json') }}

      - if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - run: npx vite build --logLevel error
        name: Build (Lighthouse — vite only, skip prerender)

      - name: Run Lighthouse CI
        run: npx @lhci/cli@latest autorun
        timeout-minutes: 5
        continue-on-error: true

  budget:
    name: Performance Budget
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: edutechlife-frontend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('edutechlife-frontend/package-lock.json') }}

      - if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - run: npm run build -- --logLevel error
      - run: npm run check-budget

  backend:
    name: Backend Tests + Lint
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: edutechlife-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: edutechlife-backend/package-lock.json

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: edutechlife-backend/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('edutechlife-backend/package-lock.json') }}

      - if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - run: node -c src/index.js
      - run: npm test

  lockfile-regenerate:
    name: Regenerate frontend package-lock (esbuild)
    if: ${{ github.event.inputs.target == 'lockfile-regenerate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Regenerate lock (with override esbuild 0.28.2 under vitest>vite)
        working-directory: edutechlife-frontend
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --force --no-audit --no-fund --ignore-scripts
      - name: Verify esbuild 0.28 present
        working-directory: edutechlife-frontend
        run: |
          node -e "const p=require('./package-lock.json').packages; const v=Object.keys(p).filter(k=>k.includes('esbuild')&&p[k].version&&p[k].version.startsWith('0.28')); console.log('esbuild_0_28_entries=', v.length); if(v.length===0) process.exit(1)"
      - name: Upload regenerated lock
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-lock
          path: edutechlife-frontend/package-lock.json
          if-no-files-found: error

  migrations-check:
    name: Migrations (fresh DB)
    if: ${{ github.event.inputs.target != 'staging-setup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta el stack local de Supabase (Postgres con auth schema) en Docker.
      - name: Start Supabase local
        run: supabase start
        timeout-minutes: 20

      # Aplica TODAS las migraciones desde una base limpia (000 → 059).
      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Valida que el schema final tenga las tablas/columnas críticas.
      - name: Validate schema
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/validate_schema.sql

      # Ejecuta los tests de contrato contra el schema recién creado.
      - name: Backend contract tests
        working-directory: edutechlife-backend
        run: |
          npm ci
          npx vitest run --testTimeout=30000

  staging-setup:
    name: Staging Setup (Supabase project + migrations)
    if: ${{ github.event.inputs.target == 'staging-setup' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ORG_ID: wxkzggyqvgufiowfiglw
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create staging project (if missing)
        id: create
        run: |
          set -euo pipefail
          REF=""
          LIST=$(supabase projects list --output json || echo "[]")
          REF=$(printf '%s' "$LIST" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((p.get("ref") or p.get("id","") for p in d if "staging" in (p.get("name","")).lower()), ""))')
          if [ -z "$REF" ]; then
            echo "::group::Creando proyecto edutechlife-staging"
            OUT=$(supabase projects create edutechlife-staging \
              --org-id "$ORG_ID" \
              --db-password "${{ secrets.SUPABASE_DB_PASSWORD }}" \
              --region us-east-1 \
              --output json)
            echo "$OUT"
            echo "::endgroup::"
            REF=$(printf '%s' "$OUT" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("ref") or d.get("id",""))')
          else
            echo "proyecto_staging_ya_existe ref=$REF"
          fi
          if [ -z "$REF" ]; then
            echo "No se pudo obtener el ref del proyecto staging"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "STAGING_PROJECT_REF=$REF"

      - name: Wait for project provisioning
        run: sleep 30

      - name: Link project
        run: |
          supabase link --project-ref "${{ steps.create.outputs.ref }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Apply migrations 000-059
        run: supabase db push

      - name: Output staging API keys (copiar a los dashboards de backend/frontend)
        run: |
          supabase projects api-keys --project-ref "${{ steps.create.outputs.ref }}" --output json

      - name: Verify schema (REST probe read-only)
        run: |
          python3 - <<'PY'
          import json, subprocess, urllib.request, time
          ref = "${{ steps.create.outputs.ref }}"
          base = "https://" + ref + ".supabase.co/rest/v1"
          out = subprocess.run(
              ["supabase", "projects", "api-keys", "--project-ref", ref, "--output", "json"],
              capture_output=True, text=True, check=True).stdout
          keys = json.loads(out)
          anon = next((k["api_key"] for k in keys if "anon" in k.get("name", "").lower()), None)
          if not anon:
              print("no se encontro la anon key")
              raise SystemExit(0)
          required = ["sessions","points_history","crisis_alerts","conversations","achievements",
                      "dani_memory","learning_plans","student_competency_mastery","timetable_slots",
                      "grade_analyses","smartboard_kids_data","missions","student_missions",
                      "badges","student_badges","notifications","early_warnings"]
          missing = []
          for _ in range(6):
              for t in list(required):
                  if t in missing:
                      continue
                  url = base + "/" + t + "?select=id&limit=1"
                  hdrs = dict(apikey=anon)
                  hdrs["Authorization"] = "Bearer " + anon
                  req = urllib.request.Request(url, headers=hdrs)
                  try:
                      with urllib.request.urlopen(req, timeout=12) as r:
                          required.remove(t)
                  except urllib.error.HTTPError as e:
                      if e.code == 404 and t not in missing:
                          missing.append(t)
                  except Exception:
                      pass
              if not required:
                  break
              time.sleep(5)
          ok = [t for t in ["sessions","points_history","crisis_alerts","conversations","achievements",
                            "dani_memory","learning_plans","student_competency_mastery","timetable_slots",
                            "grade_analyses","smartboard_kids_data","missions","student_missions",
                            "badges","student_badges","notifications","early_warnings"] if t not in missing]
          print("OK=", len(ok))
          print("MISSING=", missing)
          if missing:
              raise SystemExit(1)
          print("SCHEMA_OK")
          PY

  staging-journey:
    name: Golden User Journey (staging real)
    if: ${{ github.event.inputs.target == 'staging-journey' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve staging project + keys (in-CI, sin exponer)
        id: resolve
        run: |
          set -euo pipefail
          LIST=$(supabase projects list --output json || echo "[]")
          REF=$(printf '%s' "$LIST" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((p.get("ref") or p.get("id","") for p in d if "staging" in (p.get("name","")).lower()), ""))')
          if [ -z "$REF" ]; then echo "no staging project"; exit 1; fi
          KEYS=$(supabase projects api-keys --project-ref "$REF" --output json)
          ANON=$(printf '%s' "$KEYS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((k["api_key"] for k in d if "anon" in k.get("name","").lower()), ""))')
          SVC=$(printf '%s' "$KEYS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next((k["api_key"] for k in d if "service" in k.get("name","").lower()), ""))')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "anon=$ANON" >> "$GITHUB_OUTPUT"
          echo "service=$SVC" >> "$GITHUB_OUTPUT"
          echo "STAGING_REF=$REF"

      - name: Install backend deps
        working-directory: edutechlife-backend
        run: npm ci

      - name: DeepSeek direct probe (stream vs non-stream)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node -e '
          const key = process.env.DEEPSEEK_API_KEY;
          const mk = (stream) => ({
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
            body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: "Responde en 3 frases: como practicar matematicas" }], max_tokens: 100, stream }),
          });
          (async () => {
            try {
              const r = await fetch("https://api.deepseek.com/chat/completions", mk(true));
              const rd = r.body.getReader(); const dec = new TextDecoder(); let buf = "", n = 0;
              while (true) { const { done, value } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true }); n += value.length; }
              console.log("stream_status=", r.status, "stream_total_bytes=", n);
              console.log("stream_sample=", buf.slice(0, 250));
            } catch (e) { console.log("stream_error=", e.message); }
          })();
          '
        continue-on-error: true

      - name: Boot backend (staging)
        env:
          SUPABASE_URL: https://${{ steps.resolve.outputs.ref }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.resolve.outputs.service }}
          SUPABASE_SERVICE_KEY: ${{ steps.resolve.outputs.service }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PORT: '3001'
          FRONTEND_URL: http://localhost:3001
          BACKEND_URL: http://localhost:3001
          NODE_ENV: production
        working-directory: edutechlife-backend
        run: |
          nohup node src/index.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3001/api/health && break
            sleep 1
          done
          echo "health:"
          curl -s http://localhost:3001/api/health

      - name: Run Golden User Journey (no mocks)
        env:
          STAGING_SUPABASE_URL: https://${{ steps.resolve.outputs.ref }}.supabase.co
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ steps.resolve.outputs.service }}
          STAGING_ANON_KEY: ${{ steps.resolve.outputs.anon }}
          BASE_URL: http://localhost:3001
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        working-directory: edutechlife-backend
        run: node src/scripts/golden-journey-test.js

      - name: Run Security Live tests (IDOR/RLS/authorization — FASE D)
        if: always()
        env:
          STAGING_SUPABASE_URL: https://${{ steps.resolve.outputs.ref }}.supabase.co
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ steps.resolve.outputs.service }}
          STAGING_ANON_KEY: ${{ steps.resolve.outputs.anon }}
          BASE_URL: http://localhost:3001
        working-directory: edutechlife-backend
        run: node src/scripts/security-live-test.js

      - name: Backend log tail (diagnóstico)
        if: always()
        run: |
          echo "=== backend.log (últimas 60 líneas) ==="
          tail -60 /tmp/backend.log || echo "(sin log)"
        continue-on-error: true

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-journey-evidence
          path: /tmp/golden-journey-evidence.json
          if-no-files-found: warn

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-live-evidence
          path: /tmp/security-live-evidence.json
          if-no-files-found: warn
