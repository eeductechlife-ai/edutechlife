name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  # Gate bloqueante: 0 vulnerabilidades HIGH/CRITICAL en dependencias de runtime.
  # No tiene continue-on-error — si falla, ningún deploy sale.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-backend/package-lock.json

      - name: Install backend deps
        working-directory: edutechlife-backend
        run: npm install --prefer-offline

      - name: npm audit (backend)
        working-directory: edutechlife-backend
        run: npm audit --audit-level=high

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: edutechlife-frontend
        run: npm install --prefer-offline

      - name: npm audit (frontend)
        working-directory: edutechlife-frontend
        run: npm audit --audit-level=high --omit=dev

  # Accesibilidad WCAG 2.1 Level A (crítico) — gate bloqueante con axe-core.
  # Solo falla en violaciones Level A; AA/AAA son informativos en el reporte.
  a11y-audit:
    name: Accessibility Audit (axe-core)
    needs: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - run: npm install --prefer-offline

      - name: Build frontend
        run: npm run build

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Serve and audit (routes principales)
        run: |
          npx serve -l 4173 dist &
          sleep 3
          axe http://localhost:4173 --tags wcag2a,wcag21a --exit
          axe http://localhost:4173/ialab --tags wcag2a,wcag21a --exit
          axe http://localhost:4173/smartboard --tags wcag2a,wcag21a --exit

  migrate-db:
    name: Migrate Database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Sin `needs: migrate-db` a proposito. El frontend es estatico y no depende
  # del resultado de la migracion: si una migracion se rompe, un arreglo de UI
  # tiene que poder salir igual. El backend si queda detras de migrate-db
  # porque habla con la base directamente.
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - run: npm install --prefer-offline

      - run: npm run build

      - run: |
          npx vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --yes
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  deploy-backend:
    name: Deploy Backend (Render)
    needs: [migrate-db, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Deploy hook dispatched — Render will build and deploy."

  smoke-test:
    name: Smoke Test
    needs: [deploy-frontend, deploy-backend]
    if: ${{ always() && needs.deploy-frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deploy propagation
        run: sleep 15

      - name: Check frontend
        run: |
          curl -sf --max-time 10 "${{ secrets.SMOKE_TEST_FRONTEND_URL }}" \
            && echo "Frontend OK"

      - name: Check backend
        if: ${{ needs.deploy-backend.result == 'success' }}
        run: |
          curl -sf --max-time 10 "${{ secrets.SMOKE_TEST_BACKEND_URL }}" \
            && echo "Backend OK"
