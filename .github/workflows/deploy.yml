name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  migrate-db:
    name: Migrate Database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: migrate-db
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: |
          npx vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --yes
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  deploy-backend:
    name: Deploy Backend (Render)
    needs: migrate-db
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Deploy hook dispatched — Render will build and deploy."

  smoke-test:
    name: Smoke Test
    needs: [deploy-frontend, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deploy propagation
        run: sleep 15

      - name: Check frontend
        run: |
          curl -sf --max-time 10 "${{ secrets.SMOKE_TEST_FRONTEND_URL }}" \
            && echo "Frontend OK"

      - name: Check backend
        run: |
          curl -sf --max-time 10 "${{ secrets.SMOKE_TEST_BACKEND_URL }}" \
            && echo "Backend OK"
