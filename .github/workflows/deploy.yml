name: Deploy

on:
  push:
    branches: [main]
  # Manual: es la unica forma de correr `migrate-db` (ver el comentario del job).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

jobs:
  # Gate bloqueante: 0 vulnerabilidades HIGH/CRITICAL en dependencias de runtime.
  # No tiene continue-on-error — si falla, ningún deploy sale.
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-backend/package-lock.json

      - name: Install backend deps
        working-directory: edutechlife-backend
        run: npm install --prefer-offline

      - name: npm audit (backend)
        working-directory: edutechlife-backend
        run: npm audit --audit-level=high

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - name: Install frontend deps
        working-directory: edutechlife-frontend
        run: npm install --prefer-offline

      - name: npm audit (frontend)
        working-directory: edutechlife-frontend
        run: npm audit --audit-level=high --omit=dev

  # Accesibilidad WCAG 2.1 Level A (crítico) — gate bloqueante con axe-core.
  # Solo falla en violaciones Level A; AA/AAA son informativos en el reporte.
  a11y-audit:
    name: Accessibility Audit (axe-core)
    needs: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - run: npm install --prefer-offline

      - name: Build frontend
        run: npm run build

      # @axe-core/cli trae el ChromeDriver mas nuevo (155) y el runner trae Chrome
      # 154: "session not created", y el job fallaba sin auditar nada. Se instala
      # el ChromeDriver de la misma version mayor que el Chrome del runner.
      - name: Install axe-core CLI (ChromeDriver acorde al Chrome del runner)
        run: |
          CHROME_MAJOR=$(google-chrome --version | grep -oE '[0-9]+' | head -1)
          npm install -g @axe-core/cli "chromedriver@${CHROME_MAJOR}"
          echo "CHROMEDRIVER_PATH=$(npm root -g)/chromedriver/lib/chromedriver/chromedriver" >> "$GITHUB_ENV"

      # `-s` (single-page): sin el, serve devuelve su pagina 404 para /ialab y
      # /ingenia (no existen como archivos) y axe auditaba esa pagina, sin
      # <title> ni lang, en vez de la app. Los productos son IngenIA e IALab:
      # /smartboard es solo una redireccion heredada del nombre anterior.
      - name: Serve and audit (routes principales)
        run: |
          npx serve -s -l 4173 dist &
          sleep 3
          axe http://localhost:4173 --tags wcag2a,wcag21a --chromedriver-path "$CHROMEDRIVER_PATH" --exit
          axe http://localhost:4173/ialab --tags wcag2a,wcag21a --chromedriver-path "$CHROMEDRIVER_PATH" --exit
          axe http://localhost:4173/ingenia --tags wcag2a,wcag21a --chromedriver-path "$CHROMEDRIVER_PATH" --exit

  # Solo manual (Actions > Deploy > Run workflow). La base de produccion se
  # construyo a mano desde el panel de Supabase: su historial de migraciones
  # tiene 47 versiones con marca de tiempo que no existen en supabase/migrations/,
  # y `supabase db push` se niega a seguir ("Remote migration versions not found
  # in local migrations directory"), asi que en cada push a main fallaba sin
  # aplicar nada. Mientras ese historial no se alinee (`supabase migration repair`,
  # con copia de seguridad), las migraciones se aplican a mano. El backend se
  # despliega solo desde Render (auto-deploy de main); el job `deploy-backend`
  # de abajo queda detras de este y solo corre en una ejecucion manual.
  migrate-db:
    name: Migrate Database
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Sin `needs: migrate-db` a proposito. El frontend es estatico y no depende
  # del resultado de la migracion: si una migracion se rompe, un arreglo de UI
  # tiene que poder salir igual. El backend si queda detras de migrate-db
  # porque habla con la base directamente.
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    needs: security-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: edutechlife-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edutechlife-frontend/package-lock.json

      - run: npm install --prefer-offline

      - run: npm run build

      - run: |
          npx vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --yes
        working-directory: ${{ github.workspace }}
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

  deploy-backend:
    name: Deploy Backend (Render)
    needs: [migrate-db, security-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Deploy hook dispatched — Render will build and deploy."

  smoke-test:
    name: Smoke Test
    needs: [deploy-frontend, deploy-backend]
    if: ${{ always() && needs.deploy-frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deploy propagation
        run: sleep 15

      - name: Check frontend
        run: |
          curl -sf --max-time 10 "${{ secrets.SMOKE_TEST_FRONTEND_URL }}" \
            && echo "Frontend OK"

      - name: Check backend
        if: ${{ needs.deploy-backend.result == 'success' }}
        run: |
          curl -sf --max-time 10 "${{ secrets.SMOKE_TEST_BACKEND_URL }}" \
            && echo "Backend OK"
