name: Keep Backend Alive

on:
  schedule:
    # Every 14 minutes — Render free tier sleeps after 15 min of inactivity
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          URL="${{ secrets.SMOKE_TEST_BACKEND_URL }}/api/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          echo "Health check status: $STATUS for $URL"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend returned $STATUS — may be cold-starting"
          fi
