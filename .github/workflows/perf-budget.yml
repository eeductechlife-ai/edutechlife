name: Performance Budget Check

on:
  pull_request:
    paths:
      - 'edutechlife-frontend/src/**'
      - 'edutechlife-frontend/vite.config.js'
      - 'edutechlife-frontend/package.json'
      - 'edutechlife-frontend/package-lock.json'
      - '.github/workflows/perf-budget.yml'
  push:
    branches: [main]
    paths:
      - 'edutechlife-frontend/src/**'

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edutechlife-frontend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'edutechlife-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build:fast

      - name: Check bundle budget
        id: budget
        run: npm run check-budget
        continue-on-error: true

      - name: Generate bundle report
        if: always()
        run: |
          BUILD_ANALYZE=true npm run build:fast 2>&1 | tee bundle-report.txt || true
          if [ -f dist/bundle-stats.html ]; then
            echo "✅ Bundle analysis available: dist/bundle-stats.html"
          fi

      - name: Calculate bundle delta
        if: github.event_name == 'pull_request'
        run: |
          # Get base branch bundle size
          git checkout origin/${{ github.base_ref }} -- edutechlife-frontend/dist 2>/dev/null || true
          BASE_SIZE=$(find dist/assets -name '*.js' -type f -exec stat -c%s {} + 2>/dev/null | awk '{sum+=$1} END {print int(sum/1024)}' || echo "unknown")

          # Rebuild current branch
          npm run build:fast
          CURRENT_SIZE=$(find dist/assets -name '*.js' -type f -exec stat -c%s {} + 2>/dev/null | awk '{sum+=$1} END {print int(sum/1024)}' || echo "unknown")

          if [ "$BASE_SIZE" != "unknown" ] && [ "$CURRENT_SIZE" != "unknown" ]; then
            DELTA=$((CURRENT_SIZE - BASE_SIZE))
            PERCENT=$((DELTA * 100 / BASE_SIZE))
            echo "BUNDLE_DELTA=$DELTA" >> $GITHUB_ENV
            echo "BUNDLE_PERCENT=$PERCENT" >> $GITHUB_ENV
            echo "BASE_SIZE=$BASE_SIZE KB" >> $GITHUB_ENV
            echo "CURRENT_SIZE=$CURRENT_SIZE KB" >> $GITHUB_ENV
          fi

      - name: Comment PR with bundle size
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const delta = process.env.BUNDLE_DELTA || 'unknown';
            const percent = process.env.BUNDLE_PERCENT || 'unknown';
            const baseSize = process.env.BASE_SIZE || 'unknown';
            const currentSize = process.env.CURRENT_SIZE || 'unknown';

            const comment = `## 📦 Bundle Size Report

            | Metric | Value |
            |--------|-------|
            | Base Size | ${baseSize} |
            | Current Size | ${currentSize} |
            | Delta | ${delta} KB (${percent}%) |
            | Budget | 7.5 MB (total), 600 KB (chunk) |
            | Status | ${delta > 0 ? '⚠️ Increased' : '✅ Decreased'} |

            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail if budget exceeded
        if: steps.budget.outcome == 'failure'
        run: |
          echo "❌ Bundle size exceeds budget. Review bundle-stats.html for optimization opportunities."
          exit 1

  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edutechlife-frontend

    # Only run on PRs or push to main
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'edutechlife-frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build
        run: npm run build:fast

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          # Create lhci.json config if missing
          if [ ! -f lhci.json ]; then
            cat > lhci.json << 'EOF'
          {
            "ci": {
              "collect": {
                "numberOfRuns": 1,
                "staticDistDir": "./dist",
                "chromePath": "/usr/bin/chromium-browser",
                "settings": {
                  "chromeFlags": "--headless --no-sandbox"
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              },
              "assert": {
                "preset": "lighthouse:recommended",
                "assertions": {
                  "categories:performance": ["error", { "minScore": 0.85 }],
                  "categories:accessibility": ["warn", { "minScore": 0.90 }],
                  "categories:best-practices": ["warn", { "minScore": 0.85 }],
                  "categories:seo": ["warn", { "minScore": 0.90 }],
                  "largest-contentful-paint": ["error", { "maxNumericValue": 2500 }],
                  "interaction-to-next-paint": ["error", { "maxNumericValue": 200 }],
                  "cumulative-layout-shift": ["error", { "maxNumericValue": 0.1 }]
                }
              }
            }
          }
          EOF
          fi

          lhci autorun || echo "Lighthouse CI completed with warnings"

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const resultsPath = './.lighthouseci/results-*.json';
            const glob = require('glob');

            let results = null;
            try {
              const files = glob.sync(resultsPath);
              if (files.length > 0) {
                results = JSON.parse(fs.readFileSync(files[0], 'utf8'));
              }
            } catch (e) {
              console.log('Lighthouse results not found; skipping comment');
              return;
            }

            if (!results) return;

            const { categories, audits } = results.lhr || {};
            const scores = categories ? Object.entries(categories).reduce((acc, [name, cat]) => {
              acc[name] = Math.round(cat.score * 100);
              return acc;
            }, {}) : {};

            const cwv = {
              LCP: audits['largest-contentful-paint']?.numericValue?.toFixed(0) || 'N/A',
              INP: audits['interaction-to-next-paint']?.numericValue?.toFixed(0) || 'N/A',
              CLS: audits['cumulative-layout-shift']?.numericValue?.toFixed(3) || 'N/A',
            };

            const comment = `## 🚀 Lighthouse Performance Report

            | Category | Score |
            |----------|-------|
            | Performance | ${scores.performance || 'N/A'}/100 |
            | Accessibility | ${scores.accessibility || 'N/A'}/100 |
            | Best Practices | ${scores['best-practices'] || 'N/A'}/100 |
            | SEO | ${scores.seo || 'N/A'}/100 |

            ### Core Web Vitals

            | Metric | Value | Target |
            |--------|-------|--------|
            | LCP | ${cwv.LCP} ms | ≤ 2500 ms ✅ |
            | INP | ${cwv.INP} ms | ≤ 200 ms ✅ |
            | CLS | ${cwv.CLS} | ≤ 0.1 ✅ |
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
