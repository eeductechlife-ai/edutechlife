<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#004B63" />
  <title>Edutechlife — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 400px; }
    .logo {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #004B63, #00BCD4);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem; font-weight: 800; color: white;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #64748b; line-height: 1.5; margin-bottom: 2rem; }
    .retry-btn {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #004B63, #00BCD4);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .retry-btn:active { transform: scale(0.97); }
    [lang="en"] { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">E</div>
    <h1 id="title-es">Sin Conexión</h1>
    <h1 id="title-en" lang="en" style="display:none">No Connection</h1>
    <p id="desc-es">Parece que no tienes conexión a internet en este momento. Vuelve a intentarlo cuando estés conectado.</p>
    <p id="desc-en" lang="en" style="display:none">You appear to be offline. Please try again when you have an internet connection.</p>
    <button class="retry-btn" onclick="window.location.reload()" id="btn-es">Reintentar</button>
    <button class="retry-btn" onclick="window.location.reload()" id="btn-en" style="display:none" lang="en">Retry</button>
  </div>
  <script>
    var lang = (navigator.language || '').startsWith('en') ? 'en' : 'es';
    if (lang === 'en') {
      document.title = 'Edutechlife — No Connection';
      document.getElementById('title-es').style.display = 'none';
      document.getElementById('title-en').style.display = '';
      document.getElementById('desc-es').style.display = 'none';
      document.getElementById('desc-en').style.display = '';
      document.getElementById('btn-es').style.display = 'none';
      document.getElementById('btn-en').style.display = '';
    }
  </script>
</body>
</html>
